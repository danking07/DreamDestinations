<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Now</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>DreamDestinations</h1>
      <nav class="navlinks">
        <a href="index.html">Home</a>
        <a href="destinations.html">destinations</a>
        <a href="booking.html">Booking</a>
      </nav>
    </header>

    <main>
      <h1 class="bok1">
        Book your reservation now and well get back to you shortly
      </h1>

      <div class="booking-container">
        <h2>Book and Reserve your spot</h2>
        <p class="booking-sub">
          Fill in your details to book your spot and we will get back to you
          shortly
        </p>

        <form id="bookingForm">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" />
            <span class="spanerr" id="name-err"></span>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" />
            <span class="spanerr" id="email-err"></span>
          </div>
          <div class="form-group">
            <label for="dest">Your destination</label>
            <input type="text" id="dest" placeholder="Dubai" />
            <span class="spanerr" id="dest-err"></span>
          </div>

          <button type="submit" class="submit-btn">Book now</button>
        </form>
        <div id="feedback"></div>

        <div id="past-bookings">
          <h3>BOOKED DESTINATION</h3>
          <div id="bookings-list"></div>
        </div>
      </div>
    </main>

    <footer class="footer">All rights reserved © Copyright 2026</footer>
    <script src="style.js"></script>
  </body>
</html>
